<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <form class="registration-form" id="registrationForm" novalidate>
      <h1>Registration Form</h1>

      <div class="form-grid">
        <label>
          Prefix
          <select id="prefix" name="prefix" required>
            <option value="">Select prefix</option>
            <option value="Mr.">Mr.</option>
            <option value="Ms.">Ms.</option>
            <option value="Mrs.">Mrs.</option>
            <option value="Dr.">Dr.</option>
          </select>
          <span class="error" id="prefixError"></span>
        </label>

        <label>
          First Name
          <input type="text" id="firstName" name="firstName" placeholder="Enter first name" required>
          <span class="error" id="firstNameError"></span>
        </label>

        <label>
          Last Name
          <input type="text" id="lastName" name="lastName" placeholder="Enter last name" required>
          <span class="error" id="lastNameError"></span>
        </label>

        <label>
          Username
          <input type="text" id="username" name="username" placeholder="Choose username" required>
          <span class="error" id="usernameError"></span>
        </label>

        <label>
          Date of Birth
          <input type="date" id="dob" name="dob" required>
          <span class="error" id="dobError"></span>
        </label>

        <label>
          Password
          <input type="password" id="password" name="password" placeholder="Enter password" required>
          <span class="password-strength" id="passwordStrength"></span>
          <span class="error" id="passwordError"></span>
        </label>

        <label>
          Confirm Password
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
          <span class="error" id="confirmPasswordError"></span>
        </label>

        <fieldset class="gender-field">
          <legend>Gender</legend>
          <div class="gender-options">
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Other"> Other</label>
          </div>
          <span class="error" id="genderError"></span>
        </fieldset>

        <label>
          Contact Number
          <input type="tel" id="contact" name="contact" placeholder="10 digit number" required>
          <span class="error" id="contactError"></span>
        </label>

        <label>
          Email ID
          <input type="email" id="email" name="email" placeholder="name@example.com" required>
          <span class="error" id="emailError"></span>
        </label>

        <label>
          Age
          <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age" required>
          <span class="error" id="ageError"></span>
        </label>
      </div>

      <button type="submit">Submit</button>
      <p class="success-message" id="successMessage"></p>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
